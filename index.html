<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Macra Mari — atelier de macramê. Quadros, mandalas, porta-vasos e bolsas tecidos nó por nó com algodão orgânico. Peças prontas e sob medida, envio para todo o Brasil."
    />
    <meta name="theme-color" content="#f3ecdd" />
    <title>Macra Mari · Atelier de Macramê</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Karla:ital,wght@0,400..800;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #f3ecdd;
        color: #2c1e13;
      }
    </style>
    <script>
      /* aplica a preferência de movimento antes da primeira pintura */
      try {
        if (window.localStorage.getItem("mm-motion") === "on") {
          document.documentElement.classList.add("motion-on");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
